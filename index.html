<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Bingo Geda</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        linear-gradient(135deg, #35105e, #6a1b9a);
      color: white;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 60px;
      margin-top: 15px;
    }

    h1 {
      text-align: center;
      margin: 5px 0;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #ddd;
      margin-bottom: 30px;
    }

    .card {
      background: rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 22px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
    }

    .info {
      display: flex;
      justify-content: space-between;
      text-align: center;
      margin-bottom: 20px;
    }

    .info-box {
      flex: 1;
    }

    .info-number {
      display: block;
      font-size: 25px;
      font-weight: bold;
    }

    .info-label {
      color: #ddd;
      font-size: 13px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 16px;
      margin-top: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: linear-gradient(90deg, #ffb300, #ff6f00);
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.6;
    }

    .secondary {
      background: rgba(255,255,255,0.15);
    }

    input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 16px;
      outline: none;
    }

    #gameScreen {
      display: none;
    }

    #message {
      text-align: center;
      margin: 15px 0;
      min-height: 25px;
      color: #ffd54f;
      font-weight: bold;
    }

    .number-box {
      text-align: center;
      font-size: 50px;
      font-weight: bold;
      padding: 20px;
      margin: 20px 0;
      border-radius: 18px;
      background: rgba(255,255,255,0.12);
    }

    .called {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      margin-top: 15px;
    }

    .called span {
      background: rgba(255,255,255,0.15);
      padding: 7px 2px;
      border-radius: 5px;
      text-align: center;
      font-size: 12px;
    }

    .footer {
      text-align: center;
      color: #bbb;
      font-size: 13px;
      margin-top: 30px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="logo">🎱</div>

  <h1>BINGO GEDA</h1>

  <div class="subtitle">
    Multiplayer Bingo on Telegram
  </div>


  <!-- HOME -->

  <div id="homeScreen">

    <div class="card">

      <h2>🎮 Welcome to Bingo Geda</h2>

      <p>
        Create a Bingo room and invite your friends
        to play together.
      </p>

      <div class="info">

        <div class="info-box">
          <span
            id="playerCount"
            class="info-number"
          >0</span>

          <span class="info-label">
            Players
          </span>
        </div>

        <div class="info-box">
          <span
            id="gameStatus"
            class="info-number"
          >WAITING</span>

          <span class="info-label">
            Status
          </span>
        </div>

        <div class="info-box">
          <span
            id="calledCount"
            class="info-number"
          >0</span>

          <span class="info-label">
            Called
          </span>
        </div>

      </div>

      <button id="createButton">
        🎱 CREATE GAME
      </button>

    </div>


    <div class="card">

      <h3>👥 JOIN A GAME</h3>

      <input
        id="gameIdInput"
        type="text"
        placeholder="Enter Game ID"
      >

      <button
        id="joinButton"
        class="secondary"
      >
        🎮 JOIN GAME
      </button>

    </div>

  </div>


  <!-- GAME SCREEN -->

  <div id="gameScreen">

    <div class="card">

      <h2 style="text-align:center;">
        🎱 Bingo Room
      </h2>

      <div class="info">

        <div class="info-box">

          <span
            id="roomPlayers"
            class="info-number"
          >0</span>

          <span class="info-label">
            Players
          </span>

        </div>

        <div class="info-box">

          <span
            id="roomCalled"
            class="info-number"
          >0</span>

          <span class="info-label">
            Called
          </span>

        </div>

      </div>


      <div class="number-box">

        <div style="font-size:15px;">
          LAST NUMBER
        </div>

        <span id="lastNumber">
          —
        </span>

      </div>


      <button id="callButton">
        🔢 CALL NUMBER
      </button>

      <button
        id="refreshButton"
        class="secondary"
      >
        🔄 REFRESH GAME
      </button>

      <button
        id="backButton"
        class="secondary"
      >
        ← BACK
      </button>

    </div>


    <div class="card">

      <h3>📢 Called Numbers</h3>

      <div
        id="calledNumbers"
        class="called"
      ></div>

    </div>

  </div>


  <div id="message"></div>


  <div class="footer">
    Bot Geda • Fast • Fun • Fair
  </div>

</div>


<script>

  // ==========================================
  // TELEGRAM WEB APP
  // ==========================================

  const tg = window.Telegram?.WebApp;

  if (tg) {
    tg.ready();
    tg.expand();
  }


  // ==========================================
  // SERVER URL
  // ==========================================

  const API = window.location.origin;


  // ==========================================
  // ELEMENTS
  // ==========================================

  const createButton =
    document.getElementById("createButton");

  const joinButton =
    document.getElementById("joinButton");

  const callButton =
    document.getElementById("callButton");

  const refreshButton =
    document.getElementById("refreshButton");

  const backButton =
    document.getElementById("backButton");

  const homeScreen =
    document.getElementById("homeScreen");

  const gameScreen =
    document.getElementById("gameScreen");

  const message =
    document.getElementById("message");


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text) {

    message.textContent = text;

    setTimeout(() => {
      message.textContent = "";
    }, 3000);

  }


  // ==========================================
  // LOAD GAME
  // ==========================================

  async function loadGame() {

    try {

      const response =
        await fetch(API + "/api/game");

      const data =
        await response.json();

      if (!data.success) {
        showMessage("❌ Could not load game.");
        return;
      }

      updateGame(data.game);

    } catch (error) {

      console.error(error);

      showMessage(
        "❌ Server connection failed."
      );

    }

  }


  // ==========================================
  // UPDATE GAME DISPLAY
  // ==========================================

  function updateGame(game) {

    const players =
      game.players
        ? Object.keys(game.players).length
        : 0;

    const called =
      game.calledNumbers || [];


    document.getElementById(
      "playerCount"
    ).textContent = players;


    document.getElementById(
      "gameStatus"
    ).textContent =
      (game.status || "waiting").toUpperCase();


    document.getElementById(
      "calledCount"
    ).textContent = called.length;


    document.getElementById(
      "roomPlayers"
    ).textContent = players;


    document.getElementById(
      "roomCalled"
    ).textContent = called.length;


    if (called.length > 0) {

      document.getElementById(
        "lastNumber"
      ).textContent =
        called[called.length - 1];

    }


    const calledContainer =
      document.getElementById(
        "calledNumbers"
      );

    calledContainer.innerHTML = "";

    called.forEach(number => {

      const span =
        document.createElement("span");

      span.textContent = number;

      calledContainer.appendChild(span);

    });

  }


  // ==========================================
  // CREATE GAME
  // ==========================================

  createButton.addEventListener(
    "click",
    async function() {

      createButton.disabled = true;

      showMessage("⏳ Creating game...");

      try {

        const response =
          await fetch(
            API + "/api/game/new",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              }
            }
          );

        const data =
          await response.json();

        if (!data.success) {

          showMessage(
            "❌ Could not create game."
          );

          return;

        }


        updateGame(data.game);


        document.getElementById(
          "gameIdInput"
        ).value = data.game.id;


        homeScreen.style.display =
          "none";

        gameScreen.style.display =
          "block";


        showMessage(
          "🎉 Bingo game created!"
        );

      } catch (error) {

        console.error(error);

        showMessage(
          "❌ Server connection failed."
        );

      } finally {

        createButton.disabled = false;

      }

    }
  );


  // ==========================================
  // JOIN GAME
  // ==========================================

  joinButton.addEventListener(
    "click",
    async function() {

      const gameId =
        document
          .getElementById("gameIdInput")
          .value.trim();


      if (!gameId) {

        showMessage(
          "⚠️ Enter a Game ID first."
        );

        return;

      }


      joinButton.disabled = true;

      showMessage("⏳ Joining game...");


      try {

        const playerId =
          tg?.initDataUnsafe?.user?.id
          ? String(
              tg.initDataUnsafe.user.id
            )
          : "player_" + Date.now();


        const playerName =
          tg?.initDataUnsafe?.user?.first_name
          || "Player";


        const response =
          await fetch(
            API + "/api/game/join",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                gameId: gameId,
                playerId: playerId,
                name: playerName
              })
            }
          );


        const data =
          await response.json();


        if (!data.success) {

          showMessage(
            "❌ " +
            (data.message ||
              "Could not join game.")
          );

          return;

        }


        updateGame(data.game);


        homeScreen.style.display =
          "none";

        gameScreen.style.display =
          "block";


        showMessage(
          "🎉 You joined the game!"
        );


      } catch (error) {

        console.error(error);

        showMessage(
          "❌ Server connection failed."
        );

      } finally {

        joinButton.disabled = false;

      }

    }
  );


  // ==========================================
  // CALL NUMBER
  // ==========================================

  callButton.addEventListener(
    "click",
    async function() {

      callButton.disabled = true;

      showMessage(
        "🎱 Calling number..."
      );


      try {

        const response =
          await fetch(
            API + "/api/game/call",
            {
              method: "POST",
              headers: {
                "Content-Type":
                  "application/json"
              }
            }
          );


        const data =
          await response.json();


        if (!data.success) {

          showMessage(
            "⚠️ " +
            (data.message ||
              "Could not call number.")
          );

          return;

        }


        updateGame(data.game);


        showMessage(
          "🎱 Number " +
          data.number +
          " called!"
        );


      } catch (error) {

        console.error(error);

        showMessage(
          "❌ Server connection failed."
        );

      } finally {

        callButton.disabled = false;

      }

    }
  );


  // ==========================================
  // REFRESH
  // ==========================================

  refreshButton.addEventListener(
    "click",
    async function() {

      showMessage("🔄 Updating...");

      await loadGame();

      showMessage("✅ Game updated.");

    }
  );


  // ==========================================
  // BACK
  // ==========================================

  backButton.addEventListener(
    "click",
    function() {

      gameScreen.style.display =
        "none";

      homeScreen.style.display =
        "block";

      loadGame();

    }
  );


  // ==========================================
  // INITIAL LOAD
  // ==========================================

  loadGame();

</script>

</body>
</html>
