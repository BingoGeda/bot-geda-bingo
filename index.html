<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Bingo Geda</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 20px;

  font-family:
    Arial,
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #35105e,
      #6a1b9a
    );

  color: white;

  min-height: 100vh;

}

.container {

  max-width: 500px;

  margin: auto;

}

.header {

  text-align: center;

  margin-bottom: 25px;

}

.logo {

  font-size: 55px;

}

h1 {

  margin: 5px 0;

  font-size: 32px;

}

.subtitle {

  color: #ddd;

}

.card {

  background:
    rgba(255,255,255,0.12);

  border-radius: 20px;

  padding: 20px;

  margin-bottom: 18px;

  backdrop-filter:
    blur(10px);

}

.stats {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 10px;

}

.stat {

  text-align: center;

  background:
    rgba(255,255,255,0.08);

  padding: 12px;

  border-radius: 12px;

}

.stat strong {

  display: block;

  font-size: 22px;

  margin-bottom: 5px;

}

button {

  width: 100%;

  border: none;

  padding: 15px;

  margin-top: 10px;

  border-radius: 14px;

  background:
    linear-gradient(
      90deg,
      #ffb300,
      #ff6f00
    );

  color: white;

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

button:active {

  transform:
    scale(0.98);

}

.secondary {

  background:
    rgba(255,255,255,0.12);

}

.danger {

  background:
    #c62828;

}

.hidden {

  display: none;

}

.message {

  text-align: center;

  padding: 10px;

  color: #ffdf80;

  min-height: 25px;

}

.game-id {

  font-size: 12px;

  color: #ccc;

  text-align: center;

  word-break: break-all;

}


/* =========================
   BINGO CARD
========================= */

.bingo-title {

  text-align: center;

  font-size: 26px;

  margin-bottom: 15px;

}

.bingo-grid {

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  gap: 5px;

}

.bingo-letter {

  background: #ffb300;

  color: #35105e;

  font-weight: bold;

  text-align: center;

  padding: 10px 0;

  border-radius: 6px;

}

.bingo-number {

  background: white;

  color: #251039;

  text-align: center;

  padding: 14px 0;

  border-radius: 6px;

  font-weight: bold;

  font-size: 16px;

  cursor: pointer;

}

.bingo-number.marked {

  background: #ffb300;

  color: #35105e;

}

.free {

  background: #ffb300;

  color: #35105e;

}


/* =========================
   CALLED NUMBER
========================= */

.called {

  text-align: center;

  margin-top: 20px;

}

.called-number {

  font-size: 55px;

  font-weight: bold;

  color: #ffb300;

}

.called-list {

  display: flex;

  flex-wrap: wrap;

  gap: 6px;

  justify-content: center;

  margin-top: 10px;

}

.called-ball {

  width: 35px;

  height: 35px;

  display: flex;

  align-items: center;

  justify-content: center;

  background: white;

  color: #35105e;

  border-radius: 50%;

  font-weight: bold;

}

</style>

</head>


<body>

<div class="container">


<!-- =========================
     HEADER
========================= -->

<div class="header">

  <div class="logo">🎱</div>

  <h1>BINGO GEDA</h1>

  <div class="subtitle">
    Multiplayer Bingo on Telegram
  </div>

</div>


<!-- =========================
     HOME
========================= -->

<div id="home">


<div class="card">

  <div class="stats">

    <div class="stat">

      <strong id="players">
        0
      </strong>

      Players

    </div>


    <div class="stat">

      <strong id="status">
        WAITING
      </strong>

      Status

    </div>


    <div class="stat">

      <strong id="called">
        0
      </strong>

      Called

    </div>

  </div>


  <button
    onclick="createGame()"
  >
    🎱 CREATE GAME
  </button>


  <button
    class="secondary"
    onclick="joinGame()"
  >
    🎮 JOIN GAME
  </button>


</div>


<div
  id="message"
  class="message"
></div>


</div>


<!-- =========================
     GAME
========================= -->

<div
  id="game"
  class="hidden"
>


<div class="card">

  <div class="game-id">

    Game ID:
    <span id="gameId"></span>

  </div>


  <div class="bingo-title">
    BINGO
  </div>


  <div class="bingo-grid">

    <div class="bingo-letter">B</div>
    <div class="bingo-letter">I</div>
    <div class="bingo-letter">N</div>
    <div class="bingo-letter">G</div>
    <div class="bingo-letter">O</div>


    <div id="cell-0" class="bingo-number"></div>
    <div id="cell-1" class="bingo-number"></div>
    <div id="cell-2" class="bingo-number"></div>
    <div id="cell-3" class="bingo-number"></div>
    <div id="cell-4" class="bingo-number"></div>

    <div id="cell-5" class="bingo-number"></div>
    <div id="cell-6" class="bingo-number"></div>
    <div id="cell-7" class="bingo-number"></div>
    <div id="cell-8" class="bingo-number"></div>
    <div id="cell-9" class="bingo-number"></div>

    <div id="cell-10" class="bingo-number"></div>
    <div id="cell-11" class="bingo-number"></div>
    <div id="cell-12" class="bingo-number"></div>
    <div id="cell-13" class="bingo-number"></div>
    <div id="cell-14" class="bingo-number"></div>

    <div id="cell-15" class="bingo-number"></div>
    <div id="cell-16" class="bingo-number"></div>
    <div id="cell-17" class="bingo-number"></div>
    <div id="cell-18" class="bingo-number"></div>
    <div id="cell-19" class="bingo-number"></div>

    <div id="cell-20" class="bingo-number"></div>
    <div id="cell-21" class="bingo-number"></div>
    <div id="cell-22" class="bingo-number"></div>
    <div id="cell-23" class="bingo-number"></div>
    <div id="cell-24" class="bingo-number"></div>

  </div>


  <div class="called">

    <div>
      LAST CALLED
    </div>

    <div
      id="lastCalled"
      class="called-number"
    >
      —
    </div>


    <div class="called-list"
         id="calledList">
    </div>

  </div>


  <button
    onclick="joinCurrentGame()"
  >
    🎮 JOIN THIS GAME
  </button>


  <button
    onclick="callNumber()"
  >
    📢 CALL NEXT NUMBER
  </button>


  <button
    class="danger"
    onclick="location.reload()"
  >
    ↩️ BACK
  </button>

</div>


</div>


</div>


<script>


// ========================================
// TELEGRAM
// ========================================

const tg =
  window.Telegram &&
  window.Telegram.WebApp;

if (tg) {

  tg.ready();

  tg.expand();

}


// ========================================
// API
// ========================================

const API =
  window.location.origin;


// ========================================
// CURRENT GAME
// ========================================

let currentGame = null;

let currentPlayer = null;


// ========================================
// USER
// ========================================

function getTelegramUser() {

  if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
  ) {

    return tg.initDataUnsafe.user;

  }


  return {

    id:
      "guest-" +
      Date.now(),

    first_name:
      "Guest",

    username:
      ""

  };

}


// ========================================
// MESSAGE
// ========================================

function showMessage(text) {

  document.getElementById(
    "message"
  ).textContent = text;

}


// ========================================
// CREATE GAME
// ========================================

async function createGame() {

  showMessage(
    "⏳ Creating game..."
  );


  try {

    const response =
      await fetch(
        API +
        "/api/game/create",
        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            user:
              getTelegramUser()

          })

        }
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not create game"
      );

    }


    currentGame =
      data.game;


    await joinCreatedGame();


  }

  catch (error) {

    showMessage(
      "❌ " +
      error.message
    );

  }

}


// ========================================
// JOIN CREATED GAME
// ========================================

async function joinCreatedGame() {

  const response =
    await fetch(

      API +
      "/api/game/" +
      currentGame.id +
      "/join",

      {

        method: "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body: JSON.stringify({

          user:
            getTelegramUser()

        })

      }

    );


  const data =
    await response.json();


  if (!data.success) {

    throw new Error(
      data.message ||
      "Could not join game"
    );

  }


  currentGame =
    data.game;

  currentPlayer =
    data.player;


  openGame();

}


// ========================================
// JOIN GAME
// ========================================

async function joinGame() {

  showMessage(
    "⏳ Loading game..."
  );


  try {

    const response =
      await fetch(
        API +
        "/api/game"
      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "Game not found"
      );

    }


    currentGame =
      data.game;


    await joinCurrentGame();

  }

  catch (error) {

    showMessage(
      "❌ " +
      error.message
    );

  }

}


// ========================================
// JOIN CURRENT GAME
// ========================================

async function joinCurrentGame() {

  if (!currentGame) {

    const response =
      await fetch(
        API +
        "/api/game"
      );

    const data =
      await response.json();

    currentGame =
      data.game;

  }


  try {

    const response =
      await fetch(

        API +
        "/api/game/" +
        currentGame.id +
        "/join",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          },

          body: JSON.stringify({

            user:
              getTelegramUser()

          })

        }

      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not join"
      );

    }


    currentGame =
      data.game;

    currentPlayer =
      data.player;


    openGame();

  }

  catch (error) {

    showMessage(
      "❌ " +
      error.message
    );

  }

}


// ========================================
// OPEN GAME
// ========================================

function openGame() {

  document
    .getElementById("home")
    .classList.add("hidden");


  document
    .getElementById("game")
    .classList.remove("hidden");


  document
    .getElementById("gameId")
    .textContent =
      currentGame.id;


  updateGameUI();

}


// ========================================
// UPDATE UI
// ========================================

function updateGameUI() {

  if (!currentGame) return;


  const playerCount =
    Object.keys(
      currentGame.players || {}
    ).length;


  document
    .getElementById("players")
    .textContent =
      playerCount;


  document
    .getElementById("status")
    .textContent =
      (
        currentGame.status ||
        "waiting"
      ).toUpperCase();


  document
    .getElementById("called")
    .textContent =
      (
        currentGame.calledNumbers ||
        []
      ).length;


  const numbers =
    currentGame.calledNumbers ||
    [];


  const last =
    numbers.length
      ? numbers[numbers.length - 1]
      : "—";


  document
    .getElementById("lastCalled")
    .textContent =
      last;


  const list =
    document.getElementById(
      "calledList"
    );


  list.innerHTML = "";


  numbers
    .slice()
    .reverse()
    .forEach(number => {

      const ball =
        document.createElement(
          "div"
        );

      ball.className =
        "called-ball";

      ball.textContent =
        number;

      list.appendChild(ball);

    });


  renderCard();

}


// ========================================
// RENDER CARD
// ========================================

function renderCard() {

  if (!currentPlayer) return;


  const card =
    currentPlayer.card ||
    [];


  card.forEach(
    (value, index) => {

      const cell =
        document.getElementById(
          "cell-" + index
        );


      if (!cell) return;


      cell.textContent =
        value;


      cell.classList.remove(
        "marked"
      );


      if (value === "FREE") {

        cell.classList.add(
          "free"
        );

      }

    }
  );

}


// ========================================
// CALL NUMBER
// ========================================

async function callNumber() {

  if (!currentGame) {

    return;

  }


  try {

    const response =
      await fetch(

        API +
        "/api/game/" +
        currentGame.id +
        "/call",

        {

          method: "POST",

          headers: {

            "Content-Type":
              "application/json"

          }

        }

      );


    const data =
      await response.json();


    if (!data.success) {

      throw new Error(
        data.message ||
        "Could not call number"
      );

    }


    currentGame =
      data.game;


    updateGameUI();

  }

  catch (error) {

    alert(
      "❌ " +
      error.message
    );

  }

}


// ========================================
// AUTO REFRESH GAME
// ========================================

setInterval(
  async function() {

    if (!currentGame) return;


    try {

      const response =
        await fetch(

          API +
          "/api/game/" +
          currentGame.id

        );


      const data =
        await response.json();


      if (data.success) {

        currentGame =
          data.game;


        updateGameUI();

      }

    }

    catch (error) {

      console.log(
        "Refresh error:",
        error
      );

    }

  },

  3000

);


</script>

</body>

</html>
