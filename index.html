<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Bingo Geda</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #35105e,
          #6a1b9a
        );

      color: white;

      min-height: 100vh;

      padding: 16px;
    }

    .container {

      max-width: 520px;

      margin: auto;
    }

    .header {

      text-align: center;

      margin-bottom: 18px;
    }

    .logo {

      font-size: 42px;
    }

    .title {

      font-size: 30px;

      font-weight: 900;
    }

    .subtitle {

      color: #ddd;

      font-size: 14px;

      margin-top: 5px;
    }

    .card {

      background:
        rgba(255,255,255,0.10);

      border-radius: 20px;

      padding: 18px;

      margin-bottom: 16px;

      backdrop-filter: blur(10px);
    }

    .game-info {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-bottom: 15px;
    }

    .info {

      background:
        rgba(255,255,255,0.08);

      border-radius: 12px;

      padding: 10px 4px;

      text-align: center;
    }

    .info strong {

      display: block;

      font-size: 20px;
    }

    .info small {

      color: #ccc;

      font-size: 11px;
    }

    button {

      width: 100%;

      border: none;

      padding: 14px;

      border-radius: 14px;

      background:
        linear-gradient(
          90deg,
          #ffb300,
          #ff6f00
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 8px;
    }

    button:active {

      transform: scale(.98);
    }

    button:disabled {

      opacity: 0.6;

      cursor: not-allowed;
    }

    .secondary {

      background:
        rgba(255,255,255,.12);
    }

    .hidden {

      display: none !important;
    }

    .message {

      text-align: center;

      color: #ffe082;

      min-height: 25px;

      margin: 10px;
    }

    .game-id {

      text-align: center;

      background:
        rgba(0,0,0,.20);

      padding: 10px;

      border-radius: 10px;

      margin-bottom: 12px;

      font-size: 12px;

      word-break: break-all;
    }

    .bingo-title {

      text-align: center;

      font-size: 25px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    .bingo-grid {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 5px;
    }

    .letter {

      background: #ffb300;

      color: #35105e;

      text-align: center;

      font-weight: 900;

      padding: 10px 0;

      border-radius: 6px;
    }

    .number {

      background: white;

      color: #251039;

      text-align: center;

      padding: 13px 0;

      border-radius: 6px;

      font-weight: bold;

      cursor: pointer;

      transition: .15s;
    }

    .number:active {

      transform: scale(.94);
    }

    .number.marked {

      background: #ffb300;

      color: #35105e;

    }

    .free {

      background: #ffb300;

      color: #35105e;

    }

    .called-number {

      width: 90px;

      height: 90px;

      border-radius: 50%;

      background: #ffb300;

      color: #35105e;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: auto;

      font-size: 32px;

      font-weight: 900;
    }

    .called-list {

      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      justify-content: center;

      margin-top: 15px;
    }

    .called-list span {

      background:
        rgba(255,255,255,.15);

      padding: 6px 9px;

      border-radius: 8px;

      font-size: 12px;
    }

    .winner {

      background: #ffb300;

      color: #35105e;

      text-align: center;

      padding: 18px;

      border-radius: 15px;

      font-size: 24px;

      font-weight: 900;

      margin-top: 16px;
    }

    .player-name {

      text-align: center;

      color: #ddd;

      font-size: 14px;

      margin-bottom: 12px;
    }

    .footer {

      text-align: center;

      color: #bbb;

      font-size: 12px;

      margin-top: 20px;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->

  <div class="header">

    <div class="logo">
      🎱
    </div>

    <div class="title">
      BINGO GEDA
    </div>

    <div class="subtitle">
      Multiplayer Bingo on Telegram
    </div>

  </div>


  <!-- ========================= -->
  <!-- HOME -->
  <!-- ========================= -->

  <div id="home">

    <div class="card">

      <div class="game-info">

        <div class="info">

          <strong id="players">
            0
          </strong>

          <small>
            Players
          </small>

        </div>


        <div class="info">

          <strong id="status">
            WAITING
          </strong>

          <small>
            Status
          </small>

        </div>


        <div class="info">

          <strong id="called">
            0
          </strong>

          <small>
            Called
          </small>

        </div>

      </div>


      <div
        id="homeGameId"
        class="game-id"
      >
        No active game
      </div>


      <button
        id="createButton"
        onclick="createGame()"
      >
        🎱 CREATE GAME
      </button>


      <button
        id="joinButton"
        class="secondary"
        onclick="joinCurrentGame()"
      >
        🎮 JOIN GAME
      </button>

    </div>

  </div>


  <!-- ========================= -->
  <!-- GAME -->
  <!-- ========================= -->

  <div
    id="game"
    class="hidden"
  >

    <div class="card">

      <div class="player-name">

        👤 Playing as:
        <strong id="playerName">
          Guest
        </strong>

      </div>


      <div class="bingo-title">
        🎟️ YOUR BINGO CARD
      </div>


      <!-- BINGO LETTERS -->

      <div class="bingo-grid">

        <div class="letter">
          B
        </div>

        <div class="letter">
          I
        </div>

        <div class="letter">
          N
        </div>

        <div class="letter">
          G
        </div>

        <div class="letter">
          O
        </div>

      </div>


      <!-- BINGO NUMBERS -->

      <div
        id="bingoCard"
        class="bingo-grid"
        style="margin-top:5px;"
      ></div>


      <button onclick="checkBingo()">
        🏆 CHECK BINGO
      </button>


      <button
        class="secondary"
        onclick="backHome()"
      >
        ← BACK
      </button>

    </div>


    <!-- ========================= -->
    <!-- CALLED NUMBER -->
    <!-- ========================= -->

    <div class="card">

      <h3
        style="
          text-align:center;
          margin-bottom:12px;
        "
      >
        📢 LAST CALLED NUMBER
      </h3>


      <div
        id="lastNumber"
        class="called-number"
      >
        —
      </div>


      <div
        id="calledList"
        class="called-list"
      ></div>

    </div>


    <!-- ========================= -->
    <!-- HOST -->
    <!-- ========================= -->

    <div class="card">

      <button onclick="callNumber()">
        📢 CALL NEXT NUMBER
      </button>

    </div>


    <!-- ========================= -->
    <!-- WINNER -->
    <!-- ========================= -->

    <div
      id="winner"
      class="winner hidden"
    >
      🏆 BINGO!
    </div>

  </div>


  <!-- ========================= -->
  <!-- MESSAGE -->
  <!-- ========================= -->

  <div
    id="message"
    class="message"
  ></div>


  <!-- ========================= -->
  <!-- FOOTER -->
  <!-- ========================= -->

  <div class="footer">

    Bot Geda • Fast • Fun • Fair

  </div>


</div>


<!-- ===================================================== -->
<!-- JAVASCRIPT -->
<!-- ===================================================== -->

<script>

let currentGame = null;

let currentPlayer = null;

let markedNumbers = new Set();


// =====================================================
// TELEGRAM
// =====================================================

const tg =
  window.Telegram &&
  window.Telegram.WebApp
    ? window.Telegram.WebApp
    : null;


if (tg) {

  tg.ready();

  tg.expand();

}


// =====================================================
// MESSAGE
// =====================================================

function showMessage(text) {

  const message =
    document.getElementById(
      "message"
    );

  message.textContent = text;

}


// =====================================================
// GET TELEGRAM USER
// =====================================================

function getTelegramUser() {

  if (
    tg &&
    tg.initDataUnsafe &&
    tg.initDataUnsafe.user
  ) {

    return tg.initDataUnsafe.user;

  }


  return {

    id:
      "guest-" +
      Date.now(),

    first_name:
      "Guest",

    username:
      ""

  };

}


// =====================================================
// LOAD GAME
// =====================================================

async function loadGame() {

  try {

    const response =
      await fetch(
        "/api/game"
      );


    if (!response.ok) {

      throw new Error(
        "Server returned " +
        response.status
      );

    }


    const data =
      await response.json();


    if (!data.success) {

      showMessage(
        "❌ Could not load game."
      );

      return;

    }


    currentGame =
      data.game;


    updateGameInfo();


  } catch (error) {

    console.error(
      "LOAD GAME ERROR:",
      error
    );


    showMessage(
      "❌ Cannot connect to Bingo server."
    );

  }

}


// =====================================================
// UPDATE GAME INFORMATION
// =====================================================

function updateGameInfo() {

  if (!currentGame) {

    return;

  }


  const players =
    Object.keys(
      currentGame.players || {}
    ).length;


  document.getElementById(
    "players"
  ).textContent =
    players;


  document.getElementById(
    "status"
  ).textContent =
    (
      currentGame.status ||
      "waiting"
    ).toUpperCase();


  document.getElementById(
    "called"
  ).textContent =
    (
      currentGame.calledNumbers ||
      []
    ).length;


  document.getElementById(
    "homeGameId"
  ).textContent =
    "Game ID: " +
    currentGame.id;

}


// =====================================================
// CREATE GAME
// =====================================================

async function createGame() {

  const button =
    document.getElementById(
      "createButton"
    );


  button.disabled = true;


  showMessage(
    "🎱 Creating Bingo game..."
  );


  try {

    const response =
      await fetch(
        "/api/game/create",
        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          }

        }
      );


    const data =
      await response.json();


    console.log(
      "CREATE GAME:",
      data
    );


    if (!data.success) {

      showMessage(
        "❌ Failed to create game."
      );

      return;

    }


    currentGame =
      data.game;


    updateGameInfo();


    showMessage(
      "✅ Game created successfully! Now press JOIN GAME."
    );


  } catch (error) {

    console.error(
      "CREATE GAME ERROR:",
      error
    );


    showMessage(
      "❌ Server connection failed."
    );


  } finally {

    button.disabled = false;

  }

}


// =====================================================
// JOIN CURRENT GAME
// =====================================================

async function joinCurrentGame() {

  const button =
    document.getElementById(
      "joinButton"
    );


  button.disabled = true;


  try {

    showMessage(
      "🎮 Joining Bingo game..."
    );


    // Make sure game exists

    if (!currentGame) {

      await loadGame();

    }


    if (!currentGame) {

      showMessage(
        "❌ No game available."
      );

      return;

    }


    const user =
      getTelegramUser();


    console.log(
      "JOIN USER:",
      user
    );


    const response =
      await fetch(

        `/api/game/${currentGame.id}/join`,

        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              user: user
            })

        }

      );


    const data =
      await response.json();


    console.log(
      "JOIN GAME:",
      data
    );


    if (!data.success) {

      showMessage(
        "❌ " +
        (
          data.message ||
          "Could not join game."
        )
      );

      return;

    }


    currentGame =
      data.game;


    currentPlayer =
      data.player;


    markedNumbers =
      new Set();


    updateGameInfo();


    // Player name

    document.getElementById(
      "playerName"
    ).textContent =
      currentPlayer.name ||
      "Guest";


    // Render card

    renderBingoCard(
      currentPlayer.card
    );


    // Show game

    document
      .getElementById(
        "home"
      )
      .classList.add(
        "hidden"
      );


    document
      .getElementById(
        "game"
      )
      .classList.remove(
        "hidden"
      );


    updateCalledNumbers();


    showMessage(
      "✅ You joined Bingo Geda!"
    );


  } catch (error) {

    console.error(
      "JOIN GAME ERROR:",
      error
    );


    showMessage(
      "❌ Could not join game."
    );


  } finally {

    button.disabled = false;

  }

}


// =====================================================
// RENDER BINGO CARD
// =====================================================

function renderBingoCard(card) {

  const container =
    document.getElementById(
      "bingoCard"
    );


  container.innerHTML = "";


  if (!card) {

    return;

  }


  card.forEach(
    (number, index) => {

      const cell =
        document.createElement(
          "div"
        );


      cell.className =
        "number";


      cell.textContent =
        number;


      // FREE CENTER

      if (
        number === "FREE"
      ) {

        cell.classList.add(
          "free"
        );

        cell.classList.add(
          "marked"
        );

        markedNumbers.add(
          "FREE"
        );

      }


      // Click number

      cell.addEventListener(
        "click",
        function () {

          if (
            number === "FREE"
          ) {

            return;

          }


          // Only mark if number
          // has already been called

          const called =
            currentGame &&
            currentGame.calledNumbers
              ? currentGame.calledNumbers.includes(
                  number
                )
              : false;


          if (!called) {

            showMessage(
              "⚠️ Number " +
              number +
              " has not been called yet."
            );

            return;

          }


          cell.classList.toggle(
            "marked"
          );


          if (
            cell.classList.contains(
              "marked"
            )
          ) {

            markedNumbers.add(
              number
            );

          } else {

            markedNumbers.delete(
              number
            );

          }

        }
      );


      container.appendChild(
        cell
      );

    }
  );

}


// =====================================================
// CALL NEXT NUMBER
// =====================================================

async function callNumber() {

  if (!currentGame) {

    showMessage(
      "❌ No active game."
    );

    return;

  }


  try {

    showMessage(
      "📢 Calling next number..."
    );


    const response =
      await fetch(

        `/api/game/${currentGame.id}/call`,

        {

          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          }

        }

      );


    const data =
      await response.json();


    console.log(
      "CALL NUMBER:",
      data
    );


    if (!data.success) {

      showMessage(
        "❌ " +
        (
          data.message ||
          "Could not call number."
        )
      );

      return;

    }


    currentGame =
      data.game;


    document.getElementById(
      "lastNumber"
    ).textContent =
      data.number;


    updateGameInfo();


    updateCalledNumbers();


    // Automatically mark
    // the called number

    markCalledNumber(
      data.number
    );


    showMessage(
      "📢 Number " +
      data.number +
      " called!"
    );


  } catch (error) {

    console.error(
      "CALL NUMBER ERROR:",
      error
    );


    showMessage(
      "❌ Failed to call number."
    );

  }

}


// =====================================================
// MARK CALLED NUMBER
// =====================================================

function markCalledNumber(
  number
) {

  const cells =
    document.querySelectorAll(
      "#bingoCard .number"
    );


  cells.forEach(
    cell => {

      if (
        Number(
          cell.textContent
        ) ===
        Number(number)
      ) {

        cell.classList.add(
          "marked"
        );

        markedNumbers.add(
          number
        );

      }
