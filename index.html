<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Bingo Geda</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      font-family: Arial, sans-serif;

      background:
        linear-gradient(
          135deg,
          #35105e,
          #6a1b9a
        );

      color: white;

      min-height: 100vh;

      padding: 16px;
    }

    .container {

      max-width: 520px;

      margin: auto;
    }

    .header {

      text-align: center;

      margin-bottom: 18px;
    }

    .logo {

      font-size: 42px;
    }

    .title {

      font-size: 30px;

      font-weight: 900;
    }

    .subtitle {

      color: #ddd;

      font-size: 14px;

      margin-top: 5px;
    }

    .card {

      background:
        rgba(255,255,255,0.10);

      border-radius: 20px;

      padding: 18px;

      margin-bottom: 16px;

      backdrop-filter: blur(10px);
    }

    .game-info {

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;

      margin-bottom: 15px;
    }

    .info {

      background:
        rgba(255,255,255,0.08);

      border-radius: 12px;

      padding: 10px 4px;

      text-align: center;
    }

    .info strong {

      display: block;

      font-size: 20px;
    }

    .info small {

      color: #ccc;

      font-size: 11px;
    }

    button {

      width: 100%;

      border: none;

      padding: 14px;

      border-radius: 14px;

      background:
        linear-gradient(
          90deg,
          #ffb300,
          #ff6f00
        );

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      margin-top: 8px;
    }

    button:active {

      transform: scale(.98);
    }

    .secondary {

      background:
        rgba(255,255,255,.12);
    }

    .hidden {

      display: none;
    }

    .message {

      text-align: center;

      color: #ffe082;

      min-height: 20px;

      margin: 10px;
    }

    .bingo-title {

      text-align: center;

      font-size: 25px;

      font-weight: bold;

      margin-bottom: 12px;
    }

    .bingo-grid {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 5px;
    }

    .letter {

      background: #ffb300;

      color: #35105e;

      text-align: center;

      font-weight: 900;

      padding: 10px 0;

      border-radius: 6px;
    }

    .number {

      background: white;

      color: #251039;

      text-align: center;

      padding: 13px 0;

      border-radius: 6px;

      font-weight: bold;

      cursor: pointer;
    }

    .number.marked {

      background: #ffb300;

      color: #35105e;
    }

    .free {

      background: #ffb300;

      color: #35105e;
    }

    .called-number {

      width: 90px;

      height: 90px;

      border-radius: 50%;

      background: #ffb300;

      color: #35105e;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: auto;

      font-size: 32px;

      font-weight: 900;
    }

    .called-list {

      display: flex;

      flex-wrap: wrap;

      gap: 5px;

      justify-content: center;

      margin-top: 15px;
    }

    .called-list span {

      background:
        rgba(255,255,255,.15);

      padding: 6px 9px;

      border-radius: 8px;

      font-size: 12px;
    }

    .winner {

      background: #ffb300;

      color: #35105e;

      text-align: center;

      padding: 18px;

      border-radius: 15px;

      font-size: 24px;

      font-weight: 900;
    }

    .footer {

      text-align: center;

      color: #bbb;

      font-size: 12px;

      margin-top: 20px;
    }

  </style>

</head>


<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="logo">
      🎱
    </div>

    <div class="title">
      BINGO GEDA
    </div>

    <div class="subtitle">
      Multiplayer Bingo on Telegram
    </div>

  </div>


  <!-- HOME -->

  <div id="home">

    <div class="card">

      <div class="game-info">

        <div class="info">

          <strong id="players">
            0
          </strong>

          <small>
            Players
          </small>

        </div>

        <div class="info">

          <strong id="status">
            WAITING
          </strong>

          <small>
            Status
          </small>

        </div>

        <div class="info">

          <strong id="called">
            0
          </strong>

          <small>
            Called
          </small>

        </div>

      </div>


      <button onclick="createGame()">
        🎱 CREATE GAME
      </button>


      <button
        class="secondary"
        onclick="joinCurrentGame()"
      >
        🎮 JOIN GAME
      </button>

    </div>

  </div>


  <!-- GAME -->

  <div id="game" class="hidden">

    <div class="card">

      <div class="bingo-title">
        🎟️ YOUR BINGO CARD
      </div>


      <div class="bingo-grid">

        <div class="letter">
          B
        </div>

        <div class="letter">
          I
        </div>

        <div class="letter">
          N
        </div>

        <div class="letter">
          G
        </div>

        <div class="letter">
          O
        </div>

      </div>


      <div
        id="bingoCard"
        class="bingo-grid"
        style="margin-top:5px;"
      ></div>


      <button onclick="checkBingo()">
        🏆 CHECK BINGO
      </button>


      <button
        class="secondary"
        onclick="backHome()"
      >
        ← BACK
      </button>

    </div>


    <!-- CALLED NUMBER -->

    <div class="card">

      <h3
        style="
          text-align:center;
          margin-bottom:12px;
        "
      >
        📢 LAST CALLED NUMBER
      </h3>


      <div
        id="lastNumber"
        class="called-number"
      >
        —
      </div>


      <div
        id="calledList"
        class="called-list"
      ></div>

    </div>


    <!-- HOST -->

    <div class="card">

      <button onclick="callNumber()">
        📢 CALL NEXT NUMBER
      </button>

    </div>


    <div
      id="winner"
      class="winner hidden"
    >
      🏆 BINGO!
    </div>

  </div>


  <div
    id="message"
    class="message"
  ></div>


  <div class="footer">

    Bot Geda • Fast • Fun • Fair
